<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jorge Pereira</title>
  <meta name="description" content="Things Jorge Pereira has been making.">
  <script>
    // Apply the saved theme before the page paints, so it does not flash the plain one.
    try {
      var saved = localStorage.getItem('theme');
      if (saved && saved !== 'plain') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
  </script>
  <style>
    /* ---------- Plain (the default) ---------- */
    :root { color-scheme: light dark; }
    body {
      max-width: 36rem;
      margin: 0 auto;
      padding: 4rem 1.25rem;
      font: 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { font-size: 1.75rem; margin: 0 0 0.25rem; }
    .tagline { margin: 0 0 2rem; opacity: 0.7; }
    .links { list-style: none; margin: 0; padding: 0; }
    .links li { margin: 0 0 1rem; }
    .links a { font-weight: 600; }
    .links span { display: block; opacity: 0.7; font-size: 0.9375rem; }
    .prompt { display: none; }

    /* ---------- Theme picker ---------- */
    #themes { position: fixed; top: 0.75rem; right: 0.75rem; z-index: 10; text-align: right; }
    #themes button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    #theme-button { padding: 0.25rem 0.5rem; opacity: 0.4; font-size: 1.125rem; line-height: 1; }
    #theme-button:hover, #theme-button:focus-visible, #theme-button[aria-expanded="true"] { opacity: 1; }
    #theme-menu {
      display: flex; flex-direction: column; margin-top: 0.25rem; padding: 0.25rem;
      background: Canvas; color: CanvasText; border: 1px solid; font-size: 0.9375rem;
    }
    #theme-menu[hidden] { display: none; }
    #theme-menu button { text-align: left; padding: 0.25rem 0.75rem 0.25rem 0.25rem; white-space: nowrap; }
    #theme-menu button::before { content: "✓"; display: inline-block; width: 1.25em; visibility: hidden; }
    #theme-menu button[aria-pressed="true"]::before { visibility: visible; }
    #theme-menu button:hover, #theme-menu button:focus-visible { background: CanvasText; color: Canvas; outline: none; }

    /* ---------- MS-DOS 5.0 ---------- */
    html[data-theme="dos"] { color-scheme: dark; }
    html[data-theme="dos"] body {
      max-width: none; margin: 0; padding: 1rem 1.25rem;
      background: #000; color: #aaa;
      font: 1.5rem/1.2 "VT323", "Perfect DOS VGA 437", Consolas, Menlo, monospace;
    }
    html[data-theme="dos"] main::before { content: "C:\\>type home.txt"; display: block; margin-bottom: 1.2em; }
    html[data-theme="dos"] h1 { font: inherit; color: #fff; text-transform: uppercase; margin: 0; }
    html[data-theme="dos"] .tagline { opacity: 1; margin: 0 0 1.2em; }
    html[data-theme="dos"] .links li { margin: 0 0 1.2em; }
    html[data-theme="dos"] .links a { color: #ff5; font-weight: normal; text-decoration: none; }
    html[data-theme="dos"] .links a::before { content: "\25BA  "; color: #aaa; }
    html[data-theme="dos"] .links a:hover, html[data-theme="dos"] .links a:focus-visible { background: #aaa; color: #000; outline: none; }
    html[data-theme="dos"] .links span { opacity: 1; font-size: inherit; padding-left: 3ch; }
    html[data-theme="dos"] .prompt { display: block; margin: 0; }
    html[data-theme="dos"] .prompt::before { content: "C:\\>"; }
    html[data-theme="dos"] .prompt::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    html[data-theme="dos"] #theme-button { opacity: 0.6; }
    html[data-theme="dos"] #theme-menu { background: #aaa; color: #000; border: 0; font-size: inherit; padding: 0; }
    html[data-theme="dos"] #theme-menu button:hover, html[data-theme="dos"] #theme-menu button:focus-visible { background: #000; color: #aaa; }

    /* ---------- Windows 95 ---------- */
    html[data-theme="win95"] { color-scheme: light; }
    html[data-theme="win95"] body {
      max-width: none; margin: 0; padding: 3rem 1rem 4rem; min-height: 100vh; box-sizing: border-box;
      background: #008080; color: #000;
      font: 14px/1.4 "MS Sans Serif", "Microsoft Sans Serif", Tahoma, Arial, sans-serif;
    }
    html[data-theme="win95"] main {
      max-width: 27rem; margin: 0 auto; padding: 3px; background: #c0c0c0;
      box-shadow: inset -1px -1px #000, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff;
    }
    html[data-theme="win95"] h1 {
      display: flex; justify-content: space-between; align-items: center;
      margin: 0; padding: 3px 3px 3px 5px; background: #000080; color: #fff; font-size: 14px;
    }
    html[data-theme="win95"] h1::after {
      content: "\00D7"; width: 18px; height: 16px; line-height: 14px; text-align: center;
      background: #c0c0c0; color: #000; font-size: 16px;
      box-shadow: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    html[data-theme="win95"] .content { padding: 12px; }
    html[data-theme="win95"] .tagline { opacity: 1; margin: 0 0 12px; }
    html[data-theme="win95"] .links {
      padding: 10px; background: #fff;
      box-shadow: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #000, inset -2px -2px #dfdfdf;
    }
    html[data-theme="win95"] .links li { margin: 0 0 10px; }
    html[data-theme="win95"] .links li:last-child { margin: 0; }
    html[data-theme="win95"] .links a { color: #00f; font-weight: normal; }
    html[data-theme="win95"] .links span { opacity: 1; font-size: inherit; }
    html[data-theme="win95"] body::after {
      content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 28px; z-index: 1;
      background: #c0c0c0; border-top: 1px solid #dfdfdf; box-shadow: inset 0 1px #fff;
    }
    html[data-theme="win95"] main::after {
      content: "Start"; position: fixed; left: 2px; bottom: 3px; z-index: 2;
      height: 22px; line-height: 22px; padding: 0 10px; font-weight: bold; background: #c0c0c0;
      box-shadow: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    html[data-theme="win95"] #theme-button {
      opacity: 1; background: #c0c0c0; padding: 3px 8px; font-size: 14px;
      box-shadow: inset -1px -1px #000, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf;
    }
    html[data-theme="win95"] #theme-menu {
      background: #c0c0c0; color: #000; border: 0; padding: 3px; font-size: inherit;
      box-shadow: inset -1px -1px #000, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff;
    }
    html[data-theme="win95"] #theme-menu button:hover, html[data-theme="win95"] #theme-menu button:focus-visible { background: #000080; color: #fff; }

    /* ---------- Star Trek ---------- */
    html[data-theme="trek"] { color-scheme: dark; }
    html[data-theme="trek"] body {
      max-width: 44rem; padding: 3.5rem 1.25rem;
      background: #000; color: #fc9;
      font: 1.25rem/1.3 "Antonio", "Arial Narrow", "Helvetica Neue", Impact, sans-serif;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    html[data-theme="trek"] main {
      position: relative; padding: 1.5rem 0 3rem 1.75rem;
      border: 0 solid #c9c; border-width: 1.75rem 0 0 5rem; border-top-left-radius: 4rem 3rem;
    }
    html[data-theme="trek"] main::before {
      content: ""; position: absolute; top: 0; left: 0; width: 1.5rem; height: 1.5rem;
      background: radial-gradient(circle at 100% 100%, #000 1.45rem, #c9c 1.5rem);
    }
    html[data-theme="trek"] main::after {
      content: "47-1138"; position: absolute; left: -5rem; bottom: 0.5rem; width: 5rem;
      box-sizing: border-box; padding-right: 0.5rem; text-align: right; color: #000; font-size: 1rem;
    }
    html[data-theme="trek"] h1 { margin: 0; text-align: right; color: #f90; font-size: 2.75rem; font-weight: 400; line-height: 1.1; }
    html[data-theme="trek"] .tagline { opacity: 1; margin: 0 0 2rem; text-align: right; color: #99f; }
    html[data-theme="trek"] .links li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1rem; margin: 0 0 0.75rem; }
    html[data-theme="trek"] .links a {
      flex: none; box-sizing: border-box; width: 15rem; max-width: 100%; padding: 0.2rem 1.25rem; border-radius: 99rem; text-align: right;
      background: #f90; color: #000; font-weight: 400; text-decoration: none;
    }
    html[data-theme="trek"] .links li:nth-child(3n+2) a { background: #99f; }
    html[data-theme="trek"] .links li:nth-child(3n) a { background: #c66; }
    html[data-theme="trek"] .links a:hover, html[data-theme="trek"] .links a:focus-visible { background: #fff; outline: none; }
    html[data-theme="trek"] .links span { flex: 1 1 12rem; opacity: 1; font-size: 1rem; }
    html[data-theme="trek"] #theme-button { opacity: 0.7; color: #f90; }
    html[data-theme="trek"] #theme-menu { background: #000; color: #f90; border-color: #c9c; border-radius: 0.75rem; }
    html[data-theme="trek"] #theme-menu button:hover, html[data-theme="trek"] #theme-menu button:focus-visible { background: #f90; color: #000; border-radius: 99rem; }
    @media (max-width: 30rem) {
      html[data-theme="trek"] main { border-left-width: 2rem; padding-left: 1rem; }
      html[data-theme="trek"] main::after { display: none; }
    }
  </style>
</head>
<body>
  <div id="themes">
    <button id="theme-button" type="button" aria-label="Change theme" title="Change theme" aria-expanded="false" aria-controls="theme-menu">&#9680;</button>
    <!-- To add a theme: add a button here, and a block of html[data-theme="name"] rules in the styles above. -->
    <div id="theme-menu" hidden>
      <button type="button" data-theme="plain">Plain</button>
      <button type="button" data-theme="dos">MS-DOS 5.0</button>
      <button type="button" data-theme="win95">Windows 95</button>
      <button type="button" data-theme="trek">Star Trek</button>
    </div>
  </div>

  <main>
    <h1>Jorge Pereira</h1>
    <div class="content">
      <p class="tagline">Things I've been making.</p>

      <!-- To add a link, copy one <li> block and change the address, name and description. -->
      <ul class="links">
        <li>
          <a href="https://jorgeper.github.io/wino-and-cookie/">Wino and Cookie Games</a>
          <span>Seven cozy little games in the forest, played in the browser.</span>
        </li>
        <li>
          <a href="https://github.com/jorgeper">GitHub</a>
          <span>The code behind what I make.</span>
        </li>
      </ul>
      <p class="prompt" aria-hidden="true"></p>
    </div>
  </main>

  <script>
    (function () {
      // Web fonts are fetched only when their theme is picked.
      var fonts = {
        dos: 'https://fonts.googleapis.com/css2?family=VT323&display=swap',
        trek: 'https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap'
      };
      var root = document.documentElement;
      var button = document.getElementById('theme-button');
      var menu = document.getElementById('theme-menu');
      var choices = menu.querySelectorAll('button');

      function apply(theme, save) {
        if (!menu.querySelector('[data-theme="' + theme + '"]')) theme = 'plain';
        if (theme === 'plain') root.removeAttribute('data-theme');
        else root.setAttribute('data-theme', theme);
        if (fonts[theme] && !document.getElementById('font-' + theme)) {
          var link = document.createElement('link');
          link.id = 'font-' + theme;
          link.rel = 'stylesheet';
          link.href = fonts[theme];
          document.head.appendChild(link);
        }
        choices.forEach(function (c) {
          c.setAttribute('aria-pressed', String(c.dataset.theme === theme));
        });
        if (save) { try { localStorage.setItem('theme', theme); } catch (e) {} }
      }

      function setOpen(open) {
        menu.hidden = !open;
        button.setAttribute('aria-expanded', String(open));
      }

      button.addEventListener('click', function () { setOpen(menu.hidden); });
      choices.forEach(function (c) {
        c.addEventListener('click', function () { apply(c.dataset.theme, true); });
      });
      document.addEventListener('click', function (e) {
        if (!document.getElementById('themes').contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { setOpen(false); }
      });

      apply(root.getAttribute('data-theme') || 'plain', false);
    })();
  </script>
</body>
</html>
